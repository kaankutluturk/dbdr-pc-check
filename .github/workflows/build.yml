name: build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore .\DbdrPcCheck.slnx --runtime win-x64

      - name: Build
        run: dotnet build .\DbdrPcCheck.slnx --configuration Release --runtime win-x64 --no-restore

      - name: Test
        run: >-
          dotnet test .\DbdrPcCheck.slnx
          --configuration Release
          --runtime win-x64
          --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish single-file development build
        run: >-
          dotnet publish .\src\Dbdr.PcCheck.App\Dbdr.PcCheck.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output .\artifacts\win-x64

      - name: Verify portable single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "DBDR.PcCheck.exe") {
            $files | Select-Object Name, Length | Format-Table
            throw "Portable publish must contain exactly one DBDR.PcCheck.exe file."
          }

      - name: Upload development build
        uses: actions/upload-artifact@v7
        with:
          name: dbdr-pc-check-win-x64-${{ github.sha }}
          path: artifacts/win-x64/DBDR.PcCheck.exe
          if-no-files-found: error
          retention-days: 7
