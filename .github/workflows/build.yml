name: build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore .\DbdrPcCheck.slnx

      - name: Build
        run: dotnet build .\DbdrPcCheck.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test .\DbdrPcCheck.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Smoke test offline YARA rule-pack signer
        shell: pwsh
        run: .\tools\Test-NewDbdrYaraRulePack.ps1

      - name: Validate detection profile
        run: >-
          dotnet run --project .\src\Dbdr.PcCheck.Validation\Dbdr.PcCheck.Validation.csproj
          --configuration Release
          --no-build
          --
          .\validation\fixtures
          .\artifacts\detection-validation

      - name: Upload detection validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbdr-detection-validation-${{ github.sha }}
          path: artifacts/detection-validation/*
          if-no-files-found: warn
          retention-days: 30

      - name: Publish single-file development build
        shell: pwsh
        env:
          DBDR_YARA_KEY_ID: ${{ vars.YARA_RULE_PACK_KEY_ID }}
          DBDR_YARA_PUBLIC_KEY: ${{ vars.YARA_RULE_PACK_PUBLIC_KEY_SPKI_BASE64 }}
        run: |
          $hasKeyId = -not [string]::IsNullOrWhiteSpace($env:DBDR_YARA_KEY_ID)
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:DBDR_YARA_PUBLIC_KEY)
          if ($hasKeyId -ne $hasPublicKey) {
            throw "YARA_RULE_PACK_KEY_ID and YARA_RULE_PACK_PUBLIC_KEY_SPKI_BASE64 must be configured together."
          }
          if ($hasKeyId -and $env:DBDR_YARA_KEY_ID -notmatch '^[A-Za-z0-9_.-]{1,64}$') {
            throw "YARA_RULE_PACK_KEY_ID has an invalid format."
          }
          dotnet publish .\src\Dbdr.PcCheck.App\Dbdr.PcCheck.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:DbdrYaraRulePackKeyId=$env:DBDR_YARA_KEY_ID" `
            "-p:DbdrYaraRulePackPublicKey=$env:DBDR_YARA_PUBLIC_KEY" `
            --output .\artifacts\win-x64

      - name: Verify portable single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "DBDR.PcCheck.exe") {
            $files | Select-Object Name, Length | Format-Table
            throw "Portable publish must contain exactly one DBDR.PcCheck.exe file."
          }

      - name: Verify administrator manifest
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $mt) {
            throw "Windows Manifest Tool (mt.exe) was not found."
          }
          $embeddedManifest = Join-Path $env:RUNNER_TEMP "dbdr-embedded.manifest"
          & $mt.FullName -nologo "-inputresource:.\artifacts\win-x64\DBDR.PcCheck.exe;#1" "-out:$embeddedManifest"
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged application manifest could not be extracted."
          }
          [xml]$manifest = Get-Content $embeddedManifest -Raw
          $executionLevel = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if ($executionLevel.level -ne "requireAdministrator") {
            throw "The packaged application does not embed requireAdministrator."
          }

      - name: Launch smoke test
        shell: pwsh
        run: |
          $process = Start-Process ".\artifacts\win-x64\DBDR.PcCheck.exe" -ArgumentList "--self-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "DBDR.PcCheck.exe did not finish its startup self-test within 30 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "DBDR.PcCheck.exe startup self-test failed with exit code $($process.ExitCode)."
          }

      - name: Package transport-safe build
        shell: pwsh
        run: |
          Compress-Archive -Path ".\artifacts\win-x64\DBDR.PcCheck.exe" -DestinationPath ".\artifacts\dbdr-pc-check-win-x64.zip"
          (Get-FileHash ".\artifacts\dbdr-pc-check-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content ".\artifacts\dbdr-pc-check-win-x64.zip.sha256"

      - name: Upload development build
        uses: actions/upload-artifact@v7
        with:
          name: dbdr-pc-check-win-x64-${{ github.sha }}
          path: |
            artifacts/dbdr-pc-check-win-x64.zip
            artifacts/dbdr-pc-check-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7
